name: CI — Rustman iced

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-iced.yml"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-iced.yml"

jobs:
  build-linux:
    name: Build · Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          # Only the C toolchain is needed: libgit2, OpenSSL and SQLite are
          # vendored, and the HTML preview is drawn in-app rather than by a
          # native webview, so no GTK/WebKit development packages are required.
          sudo apt-get install -y \
            pkg-config \
            cmake \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Upload binary artefact
        uses: actions/upload-artifact@v4
        with:
          name: rustman-linux-x86_64
          path: target/release/rustman
          if-no-files-found: error
          retention-days: 7
