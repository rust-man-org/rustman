name: CI — Rustman iced

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-iced.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci-iced.yml"

jobs:
  # Windows-only code paths (e.g. the updater's ZIP extraction) never compile
  # on Linux, so a Linux-only CI let a Windows break reach master.
  test-windows:
    name: Test · Windows x86_64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Test (default features)
        run: cargo test

      - name: Test (no default features)
        run: cargo test --no-default-features

  build-linux:
    name: Build · Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxi-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libdbus-1-dev \
            pkg-config \
            cmake \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Check distro build (no self-update feature)
        run: cargo check --no-default-features --all-targets

      - name: Test (default features)
        run: cargo test

      - name: Test (no default features)
        run: cargo test --no-default-features

      - name: Upload binary artefact
        uses: actions/upload-artifact@v4
        with:
          name: rustman-linux-${{ matrix.arch }}
          path: target/release/rustman
          if-no-files-found: error
          retention-days: 7
