name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3)"
        required: false
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and tag
        id: ver
        env:
          # Via env rather than inlined into the script: a `${{ }}` expansion
          # is pasted in as raw text before bash sees it, so a value with
          # shell metacharacters would run as code.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            BASE=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
            VERSION="${BASE}-dev.${{ github.run_number }}"
          fi

          # Strip every leading "v", not just one. Cargo needs a bare semver
          # ("0.3.13"), and the build jobs sed VERSION straight into
          # Cargo.toml, so a stray prefix here fails the build with
          # "unexpected character 'v' while parsing major version number".
          # `${VERSION#v}` only ever removes one, which is how a `v0.3.13`
          # dispatch input produced tag `vv0.3.13` and an unbuildable
          # `version = "v0.3.13"`.
          VERSION="$(printf '%s' "$VERSION" | sed 's/^v*//')"

          # The tag is always derived from the normalised version, so the two
          # cannot drift apart no matter which trigger fired.
          TAG="v$VERSION"

          # Fail here with something readable rather than 20 minutes later
          # inside three parallel cargo builds.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid Cargo version. Pass a bare semver like 0.3.13 (no leading 'v')." >&2
            exit 1
          fi

          echo "Version: $VERSION / Tag: $TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Rustman ${{ steps.ver.outputs.tag }}"
          body: |
            **Rustman ${{ steps.ver.outputs.tag }}**

            Built from commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            Download the installer for your platform below. The app will also auto-update if you already have it installed.
          draft: false
          prerelease: false
          generate_release_notes: true

  # ── Rustman iced · Linux binary ───────────────────────────────────────────────
  build-linux-iced:
    name: Build · Rustman iced · Linux ${{ matrix.arch }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app has no WebKit/GTK/pdfium dependency, so the same source
          # builds natively on both runner architectures — no cross toolchain
          # or emulation.
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Patch version in Cargo.toml
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Patched Cargo.toml to $VERSION"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxi-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libdbus-1-dev \
            pkg-config \
            cmake \
            build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Package binary
        # Ship the desktop entry, icon and installer alongside the binary. A
        # bare binary has no icon anywhere in a Linux desktop: Wayland
        # compositors resolve a window's icon by matching its app id against an
        # installed .desktop file, and X11 launchers need one too. Users ran
        # Rustman with the generic placeholder icon because the tarball had
        # nothing to install.
        run: |
          mkdir -p dist/rustman
          cp target/release/rustman dist/rustman/
          cp public/icon.png dist/rustman/
          cp packaging/linux/io.github.animeshchaudhri.rustman.desktop dist/rustman/
          cp packaging/linux/install-desktop-entry.sh dist/rustman/
          chmod +x dist/rustman/install-desktop-entry.sh dist/rustman/rustman
          tar czf rustman-linux-${{ matrix.arch }}.tar.gz -C dist rustman

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: rustman-linux-${{ matrix.arch }}.tar.gz

  # ── Rustman iced · macOS universal binary ────────────────────────────────────
  build-macos-iced:
    name: Build · Rustman iced · macOS universal
    needs: prepare
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Patch version in Cargo.toml
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Patched Cargo.toml to $VERSION"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Build arm64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/rustman \
            target/x86_64-apple-darwin/release/rustman \
            -output rustman-universal

      - name: Package universal binary (for in-app self-update)
        run: |
          cp rustman-universal rustman
          tar czf Rustman-macos-universal.tar.gz rustman

      - name: Build .app bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p Rustman.app/Contents/MacOS
          mkdir -p Rustman.app/Contents/Resources
          cp rustman-universal Rustman.app/Contents/MacOS/rustman

          cat > Rustman.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>rustman</string>
            <key>CFBundleIdentifier</key>
            <string>com.animeshchaudhri.rustman</string>
            <key>CFBundleName</key>
            <string>Rustman</string>
            <key>CFBundleDisplayName</key>
            <string>Rustman</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF

      - name: Convert icon to .icns
        run: |
          mkdir -p AppIcon.iconset
          sips -z 16   16   public/icon.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32   32   public/icon.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32   32   public/icon.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64   64   public/icon.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128  128  public/icon.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256  256  public/icon.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256  256  public/icon.png --out AppIcon.iconset/icon_256x256.png
          iconutil -c icns AppIcon.iconset -o Rustman.app/Contents/Resources/AppIcon.icns

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Rustman" \
            --volicon "Rustman.app/Contents/Resources/AppIcon.icns" \
            --window-size 800 400 \
            --icon-size 120 \
            --icon "Rustman.app" 200 185 \
            --app-drop-link 600 185 \
            --hide-extension "Rustman.app" \
            "Rustman-macos-universal.dmg" \
            "Rustman.app"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            Rustman-macos-universal.dmg
            Rustman-macos-universal.tar.gz

  # ── Rustman iced · Windows ───────────────────────────────────────────────────
  build-windows-iced:
    name: Build · Rustman iced · Windows ${{ matrix.arch }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
          - runner: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Patch version in Cargo.toml
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (Get-Content Cargo.toml) -replace '^version = ".*"', "version = `"$env:VERSION`"" | Set-Content Cargo.toml
          Write-Host "Patched Cargo.toml to $env:VERSION"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Package binary
        shell: pwsh
        run: Compress-Archive -Path target\release\rustman.exe -DestinationPath rustman-windows-${{ matrix.arch }}.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: rustman-windows-${{ matrix.arch }}.zip

  # ── Checksums the in-app updater verifies downloads against ──────────────────
  checksums:
    name: Publish SHA256SUMS
    needs: [prepare, build-linux-iced, build-macos-iced, build-windows-iced]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Hash the release archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern '*.tar.gz' --pattern '*.zip' --pattern '*.dmg'
          (cd assets && sha256sum -- *) > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: SHA256SUMS
