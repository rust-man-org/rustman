[package]
name = "rustman"
version = "0.3.15"
edition = "2024"
description = "Rustman — pure-Rust native API testing tool built with iced"
authors = ["animeshchaudhri"]

[[bin]]
name = "rustman"
path = "src/main.rs"

[features]
# The default build ships the in-app updater: Settings → Updates checks GitHub
# releases, and a newer release can replace the running binary. The launch
# check itself is opt-in (issue #57).
#
# Distro packages build with `--no-default-features`. The package manager owns
# /usr/bin/rustman and delivers updates, so for those builds the updater, its
# boot-time check and its archive/swapping dependencies are compiled out
# entirely — nothing in the binary can overwrite a package-owned file.
default = ["self-update"]
self-update = ["dep:self-replace", "dep:flate2", "dep:tar", "dep:zip", "dep:minisign-verify"]

[dependencies]
# GUI
iced = { version = "0.14", features = ["tokio", "advanced", "image", "svg"] }
iced_core = "0.14"
# Glyph advances for label overflow prediction (see ui/tree_label.rs)
ttf-parser = "0.25"
# Full-featured code editor widget (line numbers, syntect highlight, selection,
# undo). The rust-man-org fork is pinned by tag in [patch.crates-io] below.
iced-code-editor = "0.3.11"
image = { version = "0.25", default-features = false, features = ["png"] }

# HTTP
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "form",
    "cookies",
    "multipart",
    "stream",
    "rustls",
    "rustls-native-certs",
] }

# Async runtime (trimmed: task/select/sync/fs only — net, io, signal and
# process come transitively only if someone actually needs them)
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "fs"] }
# Cooperative cancellation for background jobs (CancellationToken)
tokio-util = "0.7"

# WebSocket
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"

# Storage
rusqlite = { version = "0.39", features = ["bundled"] }

# Git VCS for collections
git2 = { version = "0.21", features = ["vendored-libgit2", "vendored-openssl"] }

# Crypto (for JWT auth helper)
base64 = "0.23"
sha2 = "0.11"
hmac = "0.13"

# LRU cache for parsed response bodies
lru = "0.18"

# In-app self-update (feature `self-update`, on by default): reuses the
# existing (ring-based) reqwest to fetch a release asset, then extracts +
# atomically swaps the binary. All pure-Rust, no C toolchain. Optional so
# package-manager builds (`--no-default-features`) drop them.
self-replace = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
# Verifies the minisign signature on a release's SHA256SUMS before the updater
# swaps the binary. Zero-dependency, pure Rust (no C toolchain), like the rest
# of the updater. Optional so `--no-default-features` builds drop it.
minisign-verify = { version = "0.3", optional = true }

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
open = "5"
rfd = "0.17"

# Response preview: spreadsheet (pure Rust). HTML responses are converted to
# readable text instead of embedding a native web engine.
calamine = "0.38"

# Pre-request/test scripting language: its own repo under rust-man-org. Bump
# the tag to pick up engine changes. For local engine work, point the
# override at a checkout instead:
#   [patch."https://github.com/rust-man-org/rustman-engine"]
#   rustman-engine = { path = "../rust-man-org/rustman-engine" }
rustman-engine = { git = "https://github.com/rust-man-org/rustman-engine", tag = "v0.1.0" }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs"] }

[dev-dependencies]
# The spreadsheet tests hand-build a minimal .xlsx at runtime. In normal
# builds the `zip` crate arrives through the self-update feature (above), but
# tests must also compile under `--no-default-features`, so it is listed here
# non-optionally as well.
zip = { version = "9", default-features = false, features = ["deflate"] }

# The editor widget is the rust-man-org fork of upstream iced-code-editor
# (see its README), pinned by tag. For local work against a checkout, swap
# this to: iced-code-editor = { path = "../rust-man-org/iced-code-editor-rustman" }
[patch.crates-io]
iced-code-editor = { git = "https://github.com/rust-man-org/iced-code-editor-rustman", tag = "v0.3.11" }

[profile.release]
opt-level = 'z'
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
