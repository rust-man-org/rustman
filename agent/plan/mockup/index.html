<!doctype html>
<!-- Jarwo · Ekspor kanvas: the canvas of an exported design, opened without
     Jarwo (also from a file:// folder, offline). Read only: pan, zoom, the
     live pages (pages/) or their pictures (png/). design_export.rs fills in
     the data below. -->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>postman-clone</title>
<style>
  :root {
    --bg: #f4f4f6; --dot: rgb(0 0 0 / 0.09); --bar: #ffffff; --line: rgb(0 0 0 / 0.1);
    --text: #1d1f27; --muted: #6b6e7b; --card: #eef0f3; --accent: #3d8bfd;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0f12; --dot: rgb(255 255 255 / 0.08); --bar: #1b1b20; --line: rgb(255 255 255 / 0.1);
      --text: #ececf1; --muted: #9a9caa; --card: #26262d; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0f12; --dot: rgb(255 255 255 / 0.08); --bar: #1b1b20; --line: rgb(255 255 255 / 0.1);
    --text: #ececf1; --muted: #9a9caa; --card: #26262d; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  #canvas { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: default;
    background: radial-gradient(circle, var(--dot) 1px, transparent 1px) 0 0 / 18px 18px, var(--bg); }
  #canvas.grab, #canvas.grab * { cursor: grabbing; }
  #canvas.grab iframe, #canvas.space iframe { pointer-events: none; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; --s: 1; }
  .board { position: absolute; }
  .board .body { width: 100%; height: 100%; border-radius: 4px; overflow: hidden; background: #fff; box-shadow: 0 10px 30px rgb(0 0 0 / 0.3); }
  .board iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
  .board img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .board.on .body { outline: calc(2px / var(--s)) solid var(--accent); outline-offset: calc(2px / var(--s)); }
  .label { position: absolute; left: 0; bottom: 100%; max-width: 100%; overflow: hidden; display: flex; align-items: center; gap: calc(8px / var(--s));
    padding-bottom: calc(6px / var(--s)); font-size: calc(12px / var(--s)); color: var(--muted); white-space: nowrap; cursor: pointer; user-select: none; }
  .label b { flex: 0 1 auto; min-width: 2em; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  /* The page name keeps its room; the device gives way first. */
  .label span { flex: 0 1000 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .label a { flex: none; color: var(--accent); text-decoration: none; }
  .none { display: grid; place-items: center; height: 100%; color: #888; font-size: calc(14px / var(--s)); }
  header { position: fixed; z-index: 2; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    pointer-events: none; }
  header > * { pointer-events: auto; }
  .title { display: flex; flex-direction: column; padding: 8px 12px; border-radius: 10px; background: var(--bar); border: 1px solid var(--line); box-shadow: 0 6px 20px rgb(0 0 0 / 0.15); min-width: 0; max-width: 100%; }
  .title b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title small { color: var(--muted); font-size: 11.5px; }
  .tools { display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 10px; background: var(--bar); border: 1px solid var(--line); box-shadow: 0 6px 20px rgb(0 0 0 / 0.15); }
  .tools button { height: 28px; min-width: 28px; padding: 0 9px; border-radius: 7px; color: var(--muted); }
  .tools button:hover { color: var(--text); background: var(--card); }
  .tools button.on { color: #fff; background: var(--accent); }
  .tools .sep { width: 1px; height: 18px; margin: 0 4px; background: var(--line); }
  .tools .zoom { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
  .hint { position: fixed; z-index: 2; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: var(--bar); border: 1px solid var(--line); color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  @media (max-width: 600px) { .hint { display: none; } }
</style>
</head>
<body>
<div id="canvas"><div id="world"></div></div>
<header>
  <div class="title"><b id="t"></b><small id="sub"></small></div>
  <div class="tools">
    <button id="live" type="button" title="Halaman asli: bisa diklik">Live</button>
    <button id="pics" type="button" title="Gambar tiap halaman (ringan, selalu tampil)">Gambar</button>
    <span class="sep"></span>
    <button id="out" type="button" title="Perkecil" aria-label="Perkecil">−</button>
    <button id="zoom" class="zoom" type="button" title="Pas semua">100%</button>
    <button id="in" type="button" title="Perbesar" aria-label="Perbesar">+</button>
    <span class="sep"></span>
    <button id="theme" type="button" title="Terang / gelap">◐</button>
  </div>
</header>
<div class="hint">Seret area kosong atau tahan spasi untuk menggeser · Ctrl + scroll untuk zoom · klik nama halaman untuk mendekat</div>
<script>
window.JARWO_EXPORT = {"boards":[{"file":"mockups/rustman-import-dark.html","h":800,"page":"pages/rustman-import-dark.html","png":"png/01-rustman-import-dark.png","w":1280,"x":0.0,"y":0.0},{"file":"mockups/rustman-import.html","h":800,"page":"pages/rustman-import.html","png":"png/02-rustman-import.png","w":1280,"x":1400.0,"y":0.0},{"file":"mockups/rustman-login-dark.html","h":800,"page":"pages/rustman-login-dark.html","png":"png/03-rustman-login-dark.png","w":1280,"x":2800.0,"y":0.0},{"file":"mockups/rustman-login.html","h":800,"page":"pages/rustman-login.html","png":"png/04-rustman-login.png","w":1280,"x":0.0,"y":980.0},{"file":"mockups/rustman-requester-dark.html","h":800,"page":"pages/rustman-requester-dark.html","png":"png/05-rustman-requester-dark.png","w":1280,"x":1400.0,"y":980.0},{"file":"mockups/rustman-requester.html","h":800,"page":"pages/rustman-requester.html","png":"png/06-rustman-requester.png","w":1280,"x":2800.0,"y":980.0},{"file":"mockups/rustman-runner-dark.html","h":800,"page":"pages/rustman-runner-dark.html","png":"png/07-rustman-runner-dark.png","w":1280,"x":0.0,"y":1960.0},{"file":"mockups/rustman-runner.html","h":800,"page":"pages/rustman-runner.html","png":"png/08-rustman-runner.png","w":1280,"x":1400.0,"y":1960.0},{"file":"mockups/rustman-variables-dark.html","h":800,"page":"pages/rustman-variables-dark.html","png":"png/09-rustman-variables-dark.png","w":1280,"x":2800.0,"y":1960.0},{"file":"mockups/rustman-variables.html","h":800,"page":"pages/rustman-variables.html","png":"png/10-rustman-variables.png","w":1280,"x":0.0,"y":2940.0},{"file":"mockups/rustman-requester-headers-dark.html","h":800,"page":"pages/rustman-requester-headers-dark.html","png":"png/11-rustman-requester-headers-dark.png","w":1280,"x":1400.0,"y":2940.0},{"file":"mockups/rustman-requester-headers.html","h":800,"page":"pages/rustman-requester-headers.html","png":"png/12-rustman-requester-headers.png","w":1280,"x":2800.0,"y":2940.0},{"file":"mockups/rustman-requester-body-dark.html","h":800,"page":"pages/rustman-requester-body-dark.html","png":"png/13-rustman-requester-body-dark.png","w":1280,"x":0.0,"y":3920.0},{"file":"mockups/rustman-requester-body.html","h":800,"page":"pages/rustman-requester-body.html","png":"png/14-rustman-requester-body.png","w":1280,"x":1400.0,"y":3920.0},{"file":"mockups/rustman-requester-context-dark.html","h":800,"page":"pages/rustman-requester-context-dark.html","png":"png/15-rustman-requester-context-dark.png","w":1280,"x":2800.0,"y":3920.0},{"file":"mockups/rustman-requester-context.html","h":800,"page":"pages/rustman-requester-context.html","png":"png/16-rustman-requester-context.png","w":1280,"x":0.0,"y":4900.0},{"file":"mockups/rustman-requester-params-dark.html","h":800,"page":"pages/rustman-requester-params-dark.html","png":"png/17-rustman-requester-params-dark.png","w":1280,"x":1400.0,"y":4900.0},{"file":"mockups/rustman-requester-params.html","h":800,"page":"pages/rustman-requester-params.html","png":"png/18-rustman-requester-params.png","w":1280,"x":2800.0,"y":4900.0}],"exported":"2026-11-04_100647","title":"postman-clone","workspace":"postman-clone"};
(() => {
  const data = window.JARWO_EXPORT || { title: "Desain", boards: [] };
  const DEVICES = { 1280: "Desktop", 820: "Tablet", 390: "HP" };
  const $ = (id) => document.getElementById(id);
  const canvas = $("canvas");
  const world = $("world");
  const view = { x: 40, y: 120, s: 0.3 };
  let mode = "live";
  let space = false;
  let drag = null;
  let active = -1;
  try {
    mode = localStorage.getItem("jarwo-export-mode") || mode;
    const theme = localStorage.getItem("jarwo-export-theme");
    if (theme) document.documentElement.dataset.theme = theme;
  } catch {}

  $("t").textContent = data.title || "Desain";
  $("sub").textContent = `${data.workspace ? data.workspace + " · " : ""}${data.boards.length} halaman · diekspor ${data.exported || ""}`;

  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  };

  const boards = data.boards.map((b, i) => {
    const root = el("div", "board");
    Object.assign(root.style, { left: b.x + "px", top: b.y + "px", width: b.w + "px", height: b.h + "px" });
    const label = el("div", "label");
    const open = el("a", "", "buka ↗");
    open.href = b.page;
    open.target = "_blank";
    open.rel = "noopener";
    open.title = "Buka halaman penuh di tab baru";
    label.append(el("b", "", b.file.split("/").pop()), el("span", "", `${DEVICES[b.w] || ""} ${b.w}`.trim()), open);
    label.addEventListener("click", (e) => {
      if (e.target === open) return;
      focus(i);
    });
    const body = el("div", "body");
    root.append(label, body);
    world.append(root);
    return { ...b, root, body };
  });

  const paintBodies = () => {
    for (const b of boards) {
      b.body.replaceChildren();
      if (mode === "pics" && b.png) {
        const img = el("img");
        img.src = b.png;
        img.alt = b.file;
        img.loading = "lazy";
        b.body.append(img);
      } else if (mode === "pics") b.body.append(el("div", "none", "Tidak ada gambar — pakai Live"));
      else {
        const f = el("iframe");
        f.src = b.page;
        f.title = b.file;
        f.loading = "lazy";
        b.body.append(f);
      }
    }
    $("live").classList.toggle("on", mode === "live");
    $("pics").classList.toggle("on", mode === "pics");
  };

  const place = () => {
    world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
    world.style.setProperty("--s", view.s);
    $("zoom").textContent = Math.round(view.s * 100) + "%";
  };

  const fit = (list = boards) => {
    if (!list.length) return;
    const r = canvas.getBoundingClientRect();
    const x0 = Math.min(...list.map((b) => b.x));
    const y0 = Math.min(...list.map((b) => b.y)) - 40;
    const x1 = Math.max(...list.map((b) => b.x + b.w));
    const y1 = Math.max(...list.map((b) => b.y + b.h));
    const top = 90;
    const k = Math.min(1, Math.max(0.03, Math.min((r.width - 60) / (x1 - x0), (r.height - top - 60) / (y1 - y0))));
    view.s = k;
    view.x = (r.width - (x1 - x0) * k) / 2 - x0 * k;
    view.y = top + (r.height - top - 40 - (y1 - y0) * k) / 2 - y0 * k;
    place();
  };

  const focus = (i) => {
    active = i;
    boards.forEach((b, j) => b.root.classList.toggle("on", j === i));
    fit([boards[i]]);
  };

  const zoomBy = (f, cx, cy) => {
    const r = canvas.getBoundingClientRect();
    const px = (cx ?? r.left + r.width / 2) - r.left;
    const py = (cy ?? r.top + r.height / 2) - r.top;
    const wx = (px - view.x) / view.s;
    const wy = (py - view.y) / view.s;
    view.s = Math.min(3, Math.max(0.03, view.s * f));
    view.x = px - wx * view.s;
    view.y = py - wy * view.s;
    place();
  };

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) return zoomBy(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
    view.x -= e.shiftKey ? e.deltaY : e.deltaX;
    view.y -= e.shiftKey ? 0 : e.deltaY;
    place();
  }, { passive: false });

  canvas.addEventListener("pointerdown", (e) => {
    const onPage = e.target.closest(".body") && mode === "live";
    if (e.target.closest(".label") || (onPage && !space && e.button !== 1)) return;
    drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add("grab");
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag) return;
    view.x = drag.vx + e.clientX - drag.x;
    view.y = drag.vy + e.clientY - drag.y;
    place();
  });
  const up = () => {
    drag = null;
    canvas.classList.remove("grab");
  };
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointercancel", up);

  addEventListener("keydown", (e) => {
    if (e.code === "Space" && !e.repeat) {
      space = true;
      canvas.classList.add("space");
      e.preventDefault();
    } else if ((e.ctrlKey || e.metaKey) && e.key === "0") {
      e.preventDefault();
      fit();
    } else if ((e.ctrlKey || e.metaKey) && (e.key === "=" || e.key === "+")) {
      e.preventDefault();
      zoomBy(1.2);
    } else if ((e.ctrlKey || e.metaKey) && e.key === "-") {
      e.preventDefault();
      zoomBy(1 / 1.2);
    } else if (e.key === "Escape" && active >= 0) {
      active = -1;
      boards.forEach((b) => b.root.classList.remove("on"));
      fit();
    }
  });
  addEventListener("keyup", (e) => {
    if (e.code === "Space") {
      space = false;
      canvas.classList.remove("space");
    }
  });

  const setMode = (m) => {
    mode = m;
    try { localStorage.setItem("jarwo-export-mode", m); } catch {}
    paintBodies();
  };
  $("live").addEventListener("click", () => setMode("live"));
  $("pics").addEventListener("click", () => setMode("pics"));
  $("in").addEventListener("click", () => zoomBy(1.2));
  $("out").addEventListener("click", () => zoomBy(1 / 1.2));
  $("zoom").addEventListener("click", () => fit());
  $("theme").addEventListener("click", () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const now = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    const next = now === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("jarwo-export-theme", next); } catch {}
  });

  paintBodies();
  fit();
  addEventListener("resize", () => (active >= 0 ? fit([boards[active]]) : fit()));
})();
</script>
</body>
</html>
